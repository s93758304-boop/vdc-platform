<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDC — Login / Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#faf9fc;
    color:#241f2b;
    min-height:100vh;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    padding:0 20px;
    background:#fff;
    border-bottom:1px solid #eee8f5;
}

.logo{
    text-decoration:none;
    font-size:27px;
    font-weight:800;
    color:#6d28d9;
}

.logo span{
    color:#f97316;
}

.container{
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:35px 20px 45px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:#241f2b;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#77717f;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    padding:4px;
    background:#eee9f7;
    border-radius:13px;
    margin-bottom:24px;
}

.tab{
    width:50%;
    border:0;
    background:transparent;
    color:#77717f;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.tab.active{
    background:#6d28d9;
    color:#fff;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
    color:#302a37;
}

input{
    width:100%;
    height:52px;
    border:1px solid #ddd7e6;
    border-radius:11px;
    background:#fff;
    padding:0 14px;
    font-size:16px;
    color:#222;
    outline:none;
}

input:focus{
    border-color:#6d28d9;
    box-shadow:0 0 0 3px rgba(109,40,217,.08);
}

.phone-row{
    display:flex;
    gap:8px;
}

.country-code{
    width:78px;
    height:52px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #ddd7e6;
    border-radius:11px;
    background:#fff;
    color:#333;
    font-weight:700;
    font-size:15px;
}

.phone-input{
    flex:1;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin:18px 0;
    color:#77717f;
    font-size:13px;
    line-height:1.5;
}

.terms input{
    width:17px;
    height:17px;
    margin-top:1px;
    flex-shrink:0;
}

.terms a{
    color:#6d28d9;
    text-decoration:none;
    font-weight:700;
}

.main-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#6d28d9,#8142e5);
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.main-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.secondary-btn{
    width:100%;
    height:50px;
    margin-top:10px;
    border:1px solid #6d28d9;
    border-radius:12px;
    background:#fff;
    color:#6d28d9;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.forgot{
    display:block;
    text-align:right;
    margin-top:11px;
    color:#6d28d9;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.4;
}

.message.success{
    display:block;
    background:#ecfff4;
    border:1px solid #bcebd0;
    color:#08783e;
}

.message.error{
    display:block;
    background:#fff1f1;
    border:1px solid #f0c0c0;
    color:#b42318;
}

.auth-form.hidden{
    display:none;
}

.otp-box{
    display:none;
}

.otp-box.show{
    display:block;
}

.otp-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:7px;
}

.otp-text{
    color:#77717f;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
}

.footer{
    text-align:center;
    margin-top:35px;
    color:#999;
    font-size:12px;
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">VDC<span>.</span></a>
</header>

<main class="container">

    <h1 class="title">Welcome to VDC</h1>

    <p class="subtitle">
        Login or create your VDC account using your Nigerian phone number.
    </p>

    <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
            Login
        </button>

        <button class="tab" id="registerTab" type="button">
            Register
        </button>
    </div>

    <div id="message" class="message"></div>


    <!-- LOGIN -->

    <form id="loginForm" class="auth-form">

        <div class="form-group">

            <label for="loginPhone">
                Phone Number
            </label>

            <div class="phone-row">

                <div class="country-code">
                    +234
                </div>

                <input
                    id="loginPhone"
                    class="phone-input"
                    type="tel"
                    inputmode="numeric"
                    placeholder="8012345678"
                    maxlength="10"
                    autocomplete="tel"
                    required
                >

            </div>

        </div>

        <button
            type="submit"
            class="main-btn"
            id="loginBtn"
        >
            Send Login OTP
        </button>

        <a
            class="forgot"
            id="recoveryBtn"
        >
            Recover account
        </a>

    </form>


    <!-- REGISTER -->

    <form id="registerForm" class="auth-form hidden">

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>

            <input
                id="fullName"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>


        <div class="form-group">

            <label for="registerPhone">
                Phone Number
            </label>

            <div class="phone-row">

                <div class="country-code">
                    +234
                </div>

                <input
                    id="registerPhone"
                    class="phone-input"
                    type="tel"
                    inputmode="numeric"
                    placeholder="8012345678"
                    maxlength="10"
                    autocomplete="tel"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="referralCode">
                Referral Code
                <span style="font-weight:400;color:#999;">
                    (Optional)
                </span>
            </label>

            <input
                id="referralCode"
                type="text"
                placeholder="Enter referral code"
            >

        </div>


        <div class="terms">

            <input
                id="terms"
                type="checkbox"
                required
            >

            <span>
                I agree to the VDC
                <a href="index.html">
                    Terms
                </a>
                and understand the platform rules.
            </span>

        </div>


        <button
            type="submit"
            class="main-btn"
            id="registerBtn"
        >
            Create VDC Account
        </button>

    </form>


    <!-- OTP -->

    <div id="otpBox" class="otp-box">

        <div class="otp-title">
            Verify your phone
        </div>

        <div class="otp-text">
            Enter the 6-digit verification code sent to your phone number.
        </div>

        <div class="form-group">

            <label for="otp">
                Verification Code
            </label>

            <input
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                autocomplete="one-time-code"
            >

        </div>


        <button
            class="main-btn"
            id="verifyBtn"
            type="button"
        >
            Verify OTP
        </button>


        <button
            class="secondary-btn"
            id="backBtn"
            type="button"
        >
            Change Phone Number
        </button>

    </div>


    <div class="footer">
        © 2026 VDC. All rights reserved.
    </div>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wiorfxlodrcawxdeowbg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_b3FIKdfP_UKP0Ii8ZbMREw_CVqOQv9g";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginPhone =
    document.getElementById("loginPhone");

const registerPhone =
    document.getElementById("registerPhone");

const fullName =
    document.getElementById("fullName");

const referralCode =
    document.getElementById("referralCode");

const terms =
    document.getElementById("terms");

const loginBtn =
    document.getElementById("loginBtn");

const registerBtn =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");

const otpBox =
    document.getElementById("otpBox");

const otpInput =
    document.getElementById("otp");

const verifyBtn =
    document.getElementById("verifyBtn");

const backBtn =
    document.getElementById("backBtn");

const recoveryBtn =
    document.getElementById("recoveryBtn");


let currentPhone = "";
let currentMode = "login";

let pendingName = "";
let pendingReferral = "";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function clearMessage() {

    message.textContent = "";

    message.className =
        "message";
}


/* =========================================================
   NIGERIAN PHONE FORMAT
========================================================= */

function formatNigeriaPhone(value) {

    let phone =
        value.replace(/\D/g,"");

    if(phone.startsWith("234")){

        phone =
            phone.substring(3);

    }

    if(phone.startsWith("0")){

        phone =
            phone.substring(1);

    }

    if(phone.length !== 10){

        return null;

    }

    return "+234" + phone;
}


/* =========================================================
   LOGIN TAB
========================================================= */

loginTab.addEventListener(
    "click",
    () => {

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        loginForm.classList.remove("hidden");

        registerForm.classList.add("hidden");

        otpBox.classList.remove("show");

        currentMode = "login";

        clearMessage();

    }
);


/* =========================================================
   REGISTER TAB
========================================================= */

registerTab.addEventListener(
    "click",
    () => {

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        registerForm.classList.remove("hidden");

        loginForm.classList.add("hidden");

        otpBox.classList.remove("show");

        currentMode = "register";

        clearMessage();

    }
);


/* =========================================================
   LOGIN OTP
========================================================= */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        clearMessage();

        const phone =
            formatNigeriaPhone(
                loginPhone.value
            );

        if(!phone){

            showMessage(
                "Please enter a valid Nigerian phone number."
            );

            return;
        }

        currentPhone = phone;

        currentMode = "login";

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Sending OTP...";


        try{

            const { error } =
                await db.auth.signInWithOtp({

                    phone: phone

                });


            if(error){

                throw error;

            }


            loginForm.classList.add("hidden");

            registerForm.classList.add("hidden");

            otpBox.classList.add("show");


            showMessage(
                "Verification code requested successfully.",
                "success"
            );


        }catch(error){

            showMessage(
                error.message ||
                "Unable to send OTP."
            );

        }finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Send Login OTP";

        }

    }
);


/* =========================================================
   REGISTER OTP
========================================================= */

registerForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        clearMessage();


        const name =
            fullName.value.trim();

        const phone =
            formatNigeriaPhone(
                registerPhone.value
            );

        const referral =
            referralCode.value.trim();


        if(name.length < 2){

            showMessage(
                "Please enter your full name."
            );

            return;
        }


        if(!phone){

            showMessage(
                "Please enter a valid Nigerian phone number."
            );

            return;
        }


        if(!terms.checked){

            showMessage(
                "Please accept the VDC terms before creating your account."
            );

            return;
        }


        currentPhone = phone;

        currentMode = "register";

        pendingName = name;

        pendingReferral = referral;


        registerBtn.disabled = true;

        registerBtn.textContent =
            "Sending OTP...";


        try{

            const { error } =
                await db.auth.signInWithOtp({

                    phone: phone,

                    options:{

                        shouldCreateUser:true,

                        data:{

                            full_name:name,

                            referral_code:
                                referral || null,

                            country:"Nigeria"

                        }

                    }

                });


            if(error){

                throw error;

            }


            registerForm.classList.add("hidden");

            loginForm.classList.add("hidden");

            otpBox.classList.add("show");


            showMessage(
                "Verification code requested successfully.",
                "success"
            );


        }catch(error){

            showMessage(
                error.message ||
                "Unable to send OTP."
            );

        }finally{

            registerBtn.disabled = false;

            registerBtn.textContent =
                "Create VDC Account";

        }

    }
);


/* =========================================================
   VERIFY OTP
========================================================= */

verifyBtn.addEventListener(
    "click",
    async () => {

        clearMessage();


        const token =
            otpInput.value.trim();


        if(!/^\d{6}$/.test(token)){

            showMessage(
                "Please enter the 6-digit verification code."
            );

            return;
        }


        verifyBtn.disabled = true;

        verifyBtn.textContent =
            "Verifying...";


        try{

            const { data, error } =
                await db.auth.verifyOtp({

                    phone:currentPhone,

                    token:token,

                    type:"sms"

                });


            if(error){

                throw error;

            }


            if(!data.user){

                throw new Error(
                    "Verification completed, but no user was returned."
                );

            }


            /* ---------------------------------------------
               UPDATE PROFILE AFTER REGISTRATION
            --------------------------------------------- */

            if(currentMode === "register"){

                const { error:profileError } =
                    await db
                    .from("profiles")
                    .update({

                        full_name:
                            pendingName,

                        referral_code:
                            pendingReferral || null

                    })
                    .eq(
                        "id",
                        data.user.id
                    );


                if(profileError){

                    console.warn(
                        "Profile update:",
                        profileError.message
                    );

                }

            }


            showMessage(
                "Verification successful. Opening VDC...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                1000
            );


        }catch(error){

            showMessage(
                error.message ||
                "Verification failed. Please check the OTP."
            );

        }finally{

            verifyBtn.disabled = false;

            verifyBtn.textContent =
                "Verify OTP";

        }

    }
);


/* =========================================================
   CHANGE PHONE
========================================================= */

backBtn.addEventListener(
    "click",
    () => {

        otpBox.classList.remove("show");

        otpInput.value = "";

        clearMessage();


        if(currentMode === "register"){

            registerForm.classList.remove("hidden");

        }else{

            loginForm.classList.remove("hidden");

        }

    }
);


/* =========================================================
   ACCOUNT RECOVERY
========================================================= */

recoveryBtn.addEventListener(
    "click",
    () => {

        loginTab.click();

        showMessage(
            "Enter your registered phone number to receive a new verification code."
        );

        loginPhone.focus();

    }
);


/* =========================================================
   EXISTING SESSION
========================================================= */

async function checkExistingSession(){

    const { data } =
        await db.auth.getSession();


    if(
        data &&
        data.session
    ){

        window.location.href =
            "dashboard.html";

    }

}


checkExistingSession();

</script>

</body>
</html>
