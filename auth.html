<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDC — Login & Register</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #24113f;
    min-height: 100vh;
}

.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #eee;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #6824a8;
}

.ng {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
}

.flag {
    width: 24px;
    height: 16px;
    display: flex;
}

.flag span {
    flex: 1;
}

.green {
    background: #008751;
}

.white {
    background: #fff;
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
}

.container {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 35px 20px 50px;
}

.heading {
    text-align: center;
    margin-bottom: 28px;
}

.heading h1 {
    font-size: 29px;
    margin-bottom: 9px;
}

.heading p {
    color: #777;
    font-size: 14px;
}

.tabs {
    display: flex;
    background: #f4f1f8;
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.tab {
    width: 50%;
    padding: 12px;
    border: 0;
    background: transparent;
    border-radius: 9px;
    font-weight: 700;
    color: #777;
}

.tab.active {
    background: #6824a8;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
}

.input-group {
    margin-bottom: 17px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #6824a8;
}

.btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #6824a8;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.btn:hover {
    opacity: .92;
}

.note {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 18px;
    line-height: 1.5;
}

.terms {
    margin: 15px 0;
    font-size: 13px;
    color: #666;
}

.terms input {
    width: auto;
    margin-right: 7px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #6824a8;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">VDC</div>

    <div class="ng">
        <div class="flag">
            <span class="green"></span>
            <span class="white"></span>
            <span class="green"></span>
        </div>
        Nigeria
    </div>
</header>

<main class="container">

    <div class="heading">
        <h1>Welcome to VDC</h1>
        <p>Access your VDC account</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showForm('login', this)">
            Login
        </button>

        <button class="tab" onclick="showForm('register', this)">
            Register
        </button>
    </div>

    <!-- LOGIN -->

    <form id="login" class="form active">

        <div class="input-group">
            <label>Phone Number</label>
            <input
                type="tel"
                placeholder="08012345678"
                required
            >
        </div>

        <button class="btn" type="submit">
            Continue
        </button>

        <p class="note">
            You will receive a verification code on your phone.
        </p>

    </form>

    <!-- REGISTER -->

    <form id="register" class="form">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                type="tel"
                placeholder="08012345678"
                required
            >
        </div>

        <div class="input-group">
            <label>Referral Code</label>
            <input
                type="text"
                placeholder="Optional"
            >
        </div>

        <div class="terms">
            <label>
                <input type="checkbox" required>
                I agree to the VDC Terms and Privacy Policy.
            </label>
        </div>

        <button class="btn" type="submit">
            Create Account
        </button>

        <p class="note">
            Phone verification will be required.
        </p>

    </form>

    <a href="index.html" class="back">
        Back to VDC
    </a>

</main>

<script>
function showForm(formId, button) {

    document.querySelectorAll('.form').forEach(form => {
        form.classList.remove('active');
    });

    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });

    document.getElementById(formId).classList.add('active');
    button.classList.add('active');
}
</script>

</body>
</html>
