<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDC — Login & Register</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #24113f;
    min-height: 100vh;
}

.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #eeeeee;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #6824a8;
}

.ng {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
}

.flag {
    width: 24px;
    height: 16px;
    display: flex;
}

.flag span {
    flex: 1;
}

.green {
    background: #008751;
}

.white {
    background: #ffffff;
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
}

.container {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 35px 20px 50px;
}

.heading {
    text-align: center;
    margin-bottom: 28px;
}

.heading h1 {
    font-size: 29px;
    margin-bottom: 9px;
}

.heading p {
    color: #777;
    font-size: 14px;
}

.tabs {
    display: flex;
    background: #f4f1f8;
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.tab {
    width: 50%;
    padding: 12px;
    border: 0;
    background: transparent;
    border-radius: 9px;
    font-weight: 700;
    color: #777;
    cursor: pointer;
}

.tab.active {
    background: #6824a8;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

.input-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dddddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #6824a8;
}

.btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #6824a8;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.btn:hover {
    opacity: .92;
}

.forgot {
    display: block;
    text-align: right;
    margin-top: 12px;
    color: #6824a8;
    font-size: 13px;
    text-decoration: none;
}

.note {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 18px;
    line-height: 1.5;
}

.terms {
    margin: 15px 0;
    font-size: 13px;
    color: #666;
}

.terms label {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-weight: normal;
    line-height: 1.4;
}

.terms input {
    width: auto;
    margin-top: 3px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #6824a8;
    text-decoration: none;
    font-size: 14px;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 9px;
    background: #f4f1f8;
    color: #6824a8;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 400px) {
    .container {
        padding-left: 16px;
        padding-right: 16px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a href="index.html"
       style="text-decoration:none;">
        <div class="logo">VDC</div>
    </a>

    <div class="ng">

        <div class="flag">
            <span class="green"></span>
            <span class="white"></span>
            <span class="green"></span>
        </div>

        Nigeria

    </div>

</header>


<main class="container">

    <div class="heading">

        <h1>Welcome to VDC</h1>

        <p>
            Access your VDC account
        </p>

    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="showForm('login', this)"
            type="button">

            Login

        </button>


        <button
            class="tab"
            onclick="showForm('register', this)"
            type="button">

            Register

        </button>

    </div>


    <div id="message"
         class="message">
    </div>


    <!-- LOGIN -->

    <form
        id="login"
        class="form active"
        onsubmit="loginForm(event)">

        <div class="input-group">

            <label>
                Phone Number
            </label>

            <input
                id="loginPhone"
                type="tel"
                inputmode="tel"
                placeholder="08012345678"
                required>

        </div>


        <button
            class="btn"
            type="submit">

            Continue

        </button>


        <a
            href="#"
            class="forgot"
            onclick="forgotPassword(); return false;">

            Forgot password?

        </a>


        <p class="note">

            Phone verification will be required
            when account authentication is connected.

        </p>

    </form>



    <!-- REGISTER -->

    <form
        id="register"
        class="form"
        onsubmit="registerForm(event)">

        <div class="input-group">

            <label>
                Full Name
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="Enter your full name"
                required>

        </div>


        <div class="input-group">

            <label>
                Phone Number
            </label>

            <input
                id="registerPhone"
                type="tel"
                inputmode="tel"
                placeholder="08012345678"
                required>

        </div>


        <div class="input-group">

            <label>
                Referral Code
            </label>

            <input
                id="referralCode"
                type="text"
                placeholder="Optional">

        </div>


        <div class="terms">

            <label>

                <input
                    type="checkbox"
                    required>

                <span>
                    I agree to the VDC Terms
                    and Privacy Policy.
                </span>

            </label>

        </div>


        <button
            class="btn"
            type="submit">

            Create Account

        </button>


        <p class="note">

            Phone verification will be required.

        </p>

    </form>


    <a
        href="index.html"
        class="back">

        Back to VDC

    </a>

</main>


<script>

function showForm(formId, button) {

    document
        .querySelectorAll('.form')
        .forEach(function(form) {

            form.classList.remove('active');

        });


    document
        .querySelectorAll('.tab')
        .forEach(function(tab) {

            tab.classList.remove('active');

        });


    document
        .getElementById(formId)
        .classList.add('active');


    button.classList.add('active');

    clearMessage();
}


function showMessage(text) {

    const box =
        document.getElementById('message');

    box.textContent = text;

    box.style.display = 'block';

}


function clearMessage() {

    const box =
        document.getElementById('message');

    box.style.display = 'none';

}


function loginForm(event) {

    event.preventDefault();

    showMessage(
        'Phone verification will be connected when SMS authentication is enabled.'
    );

}


function registerForm(event) {

    event.preventDefault();

    showMessage(
        'Phone verification will be connected when SMS authentication is enabled.'
    );

}


function forgotPassword() {

    showMessage(
        'Account recovery will use phone verification. SMS recovery will be enabled when phone authentication is connected.'
    );

}

</script>

</body>
</html>
