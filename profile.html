<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDC — My Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --purple:#6d28d9;
  --purple-dark:#4c1d95;
  --orange:#f97316;
  --bg:#faf9fc;
  --card:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#eeeef2;
  --green:#008751;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
a{
  font-family:inherit;
}

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.topbar-inner{
  max-width:760px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-btn{
  width:40px;
  height:40px;
  border:0;
  background:#f5f3ff;
  color:var(--purple);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.logo{
  text-decoration:none;
  color:var(--purple);
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:var(--orange);
}

.page{
  max-width:760px;
  margin:auto;
  padding:22px 16px 100px;
}

.title{
  font-size:27px;
  font-weight:800;
  margin-bottom:5px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.profile-card{
  background:linear-gradient(135deg,#4c1d95,#6d28d9);
  border-radius:22px;
  padding:24px 20px;
  color:#fff;
  margin-bottom:18px;
  text-align:center;
}

.avatar{
  width:70px;
  height:70px;
  margin:0 auto 12px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-name{
  font-size:20px;
  font-weight:800;
  margin-bottom:5px;
}

.profile-phone{
  font-size:13px;
  color:rgba(255,255,255,.8);
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.13);
  font-size:11px;
  font-weight:700;
}

.status-dot{
  width:7px;
  height:7px;
  background:#22c55e;
  border-radius:50%;
}

.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:16px;
  overflow:hidden;
}

.section-title{
  padding:17px 17px 10px;
  font-size:14px;
  font-weight:800;
}

.info-row{
  min-height:58px;
  padding:11px 17px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.info-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.info-icon{
  width:36px;
  height:36px;
  flex-shrink:0;
  background:#f5f3ff;
  color:var(--purple);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.info-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:3px;
}

.info-value{
  font-size:13px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.ref-code{
  color:var(--purple);
}

.action-row{
  min-height:58px;
  padding:11px 17px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-decoration:none;
  color:var(--text);
}

.action-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.action-arrow{
  color:#999;
}

.logout{
  width:100%;
  border:0;
  background:#fff;
  border:1px solid #fecaca;
  color:var(--red);
  border-radius:14px;
  padding:14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:13px;
}

.error{
  display:none;
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#be123c;
  border-radius:13px;
  padding:13px;
  margin-bottom:15px;
  font-size:13px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  border-top:1px solid var(--border);
  z-index:30;
}

.nav-inner{
  max-width:760px;
  height:100%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-item{
  text-decoration:none;
  color:#888;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav-item.active{
  color:var(--purple);
  font-weight:700;
}

svg{
  display:block;
}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <button class="back-btn" onclick="goBack()" aria-label="Back">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>

    </button>

    <a href="dashboard.html" class="logo">
      VDC<span>.</span>
    </a>

    <div style="width:40px"></div>

  </div>

</header>


<main class="page">

  <h1 class="title">My Profile</h1>

  <p class="subtitle">
    Manage your VDC account information.
  </p>

  <div id="errorBox" class="error"></div>


  <div id="loading" class="loading">
    Loading your profile...
  </div>


  <div id="profileContent" style="display:none;">


    <!-- PROFILE HEADER -->

    <section class="profile-card">

      <div class="avatar">

        <svg width="34" height="34" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7">

          <circle cx="12" cy="8" r="3.5"></circle>

          <path d="M5 20c.9-3.7 3.2-5.5 7-5.5s6.1 1.8 7 5.5"></path>

        </svg>

      </div>

      <div class="profile-name" id="profileName">
        Member
      </div>

      <div class="profile-phone" id="profilePhone">
        —
      </div>

      <div class="status">

        <span class="status-dot"></span>

        Verified Account

      </div>

    </section>


    <!-- ACCOUNT INFORMATION -->

    <section class="section">

      <div class="section-title">
        Account Information
      </div>


      <div class="info-row">

        <div class="info-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <circle cx="12" cy="8" r="3"></circle>

              <path d="M5 20c.8-3.5 3-5 7-5s6.2 1.5 7 5"></path>

            </svg>

          </div>

          <div>

            <div class="info-label">
              Full Name
            </div>

            <div class="info-value" id="fullName">
              —
            </div>

          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <path d="M6 4h12v16H6z"></path>

              <path d="M9 7h6"></path>

              <path d="M9 11h6"></path>

            </svg>

          </div>

          <div>

            <div class="info-label">
              Phone Number
            </div>

            <div class="info-value" id="phoneNumber">
              —
            </div>

          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <path d="M12 21s7-4.4 7-10a7 7 0 0 0-14 0c0 5.6 7 10 7 10z"></path>

              <circle cx="12" cy="11" r="2.5"></circle>

            </svg>

          </div>

          <div>

            <div class="info-label">
              Country
            </div>

            <div class="info-value" id="country">
              Nigeria
            </div>

          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7"></path>

              <path d="M8 12V5h8v7"></path>

              <path d="M8 8h8"></path>

            </svg>

          </div>

          <div>

            <div class="info-label">
              Referral Code
            </div>

            <div class="info-value ref-code" id="referralCode">
              —
            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- ACCOUNT ACTIONS -->

    <section class="section">

      <div class="section-title">
        Account
      </div>


      <a href="referral.html" class="action-row">

        <div class="action-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <circle cx="9" cy="8" r="3"></circle>

              <circle cx="17" cy="10" r="2"></circle>

              <path d="M3 20c.7-3.4 2.7-5 6-5s5.3 1.6 6 5"></path>

              <path d="M15 15c2.5-.1 4.4 1.2 5 4"></path>

            </svg>

          </div>

          <span>Refer & Earn</span>

        </div>

        <svg class="action-arrow" width="18" height="18"
             viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">

          <path d="M9 18l6-6-6-6"></path>

        </svg>

      </a>


      <a href="withdraw.html" class="action-row">

        <div class="action-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <path d="M3 10h18"></path>

              <path d="M5 10v9"></path>

              <path d="M9 10v9"></path>

              <path d="M15 10v9"></path>

              <path d="M19 10v9"></path>

              <path d="M3 19h18"></path>

              <path d="M12 3l9 5H3l9-5z"></path>

            </svg>

          </div>

          <span>Bank & Withdrawal</span>

        </div>

        <svg class="action-arrow" width="18" height="18"
             viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">

          <path d="M9 18l6-6-6-6"></path>

        </svg>

      </a>


      <a href="history.html" class="action-row">

        <div class="action-left">

          <div class="info-icon">

            <svg width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8">

              <circle cx="12" cy="12" r="9"></circle>

              <path d="M12 7v5l3 2"></path>

            </svg>

          </div>

          <span>Transaction History</span>

        </div>

        <svg class="action-arrow" width="18" height="18"
             viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">

          <path d="M9 18l6-6-6-6"></path>

        </svg>

      </a>

    </section>


    <button class="logout" onclick="logout()">
      Log Out
    </button>

  </div>

</main>


<nav class="bottom-nav">

  <div class="nav-inner">

    <a class="nav-item" href="dashboard.html">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">

        <path d="M3 11.5L12 4l9 7.5"></path>

        <path d="M5 10.5V20h14v-9.5"></path>

      </svg>

      <span>Home</span>

    </a>


    <a class="nav-item" href="tasks.html">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">

        <rect x="5" y="3" width="14" height="18" rx="2"></rect>

        <path d="M9 7h6"></path>

        <path d="M9 11h6"></path>

        <path d="M9 15h4"></path>

      </svg>

      <span>Tasks</span>

    </a>


    <a class="nav-item" href="vip.html">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">

        <path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-.8L12 3z"></path>

      </svg>

      <span>VIP</span>

    </a>


    <a class="nav-item" href="earn.html">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">

        <path d="M12 19V5"></path>

        <path d="M6 11l6-6 6 6"></path>

      </svg>

      <span>Earn</span>

    </a>


    <a class="nav-item active" href="profile.html">

      <svg width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">

        <circle cx="12" cy="8" r="3"></circle>

        <path d="M5 20c.8-3.5 3-5 7-5s6.2 1.5 7 5"></path>

      </svg>

      <span>My</span>

    </a>

  </div>

</nav>


<script>

const SUPABASE_URL =
  "https://wiorfxlodrcawxdeowbg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b3FIKdfP_UKP0Ii8ZbMREw_CVqOQv9g";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;


/* ==============================
   BACK
============================== */

function goBack(){

  if(document.referrer){
    history.back();
  }else{
    window.location.href = "dashboard.html";
  }

}


/* ==============================
   ERROR
============================== */

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";

}


/* ==============================
   LOAD PROFILE
============================== */

async function loadProfile(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){

    window.location.href = "auth.html";
    return;

  }

  currentUser = session.user;

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("full_name,phone,country,referral_code")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){

    console.error(error);

    showError(
      "Unable to load your profile."
    );

    document.getElementById("loading").style.display =
      "none";

    return;

  }

  if(!data){

    showError(
      "Your profile has not been created yet."
    );

    document.getElementById("loading").style.display =
      "none";

    return;

  }

  const fullName =
    data.full_name ||
    currentUser.user_metadata?.full_name ||
    "VDC Member";

  const phone =
    data.phone ||
    currentUser.phone ||
    "—";

  const country =
    data.country ||
    "Nigeria";

  const referralCode =
    data.referral_code ||
    "Not assigned";

  document.getElementById("profileName").textContent =
    fullName;

  document.getElementById("profilePhone").textContent =
    phone;

  document.getElementById("fullName").textContent =
    fullName;

  document.getElementById("phoneNumber").textContent =
    phone;

  document.getElementById("country").textContent =
    country;

  document.getElementById("referralCode").textContent =
    referralCode;

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("profileContent").style.display =
    "block";

}


/* ==============================
   LOGOUT
============================== */

async function logout(){

  const button =
    document.querySelector(".logout");

  button.disabled = true;
  button.textContent = "Logging out...";

  const {
    error
  } = await supabaseClient.auth.signOut();

  if(error){

    console.error(error);

    showError(
      "Unable to log out. Please try again."
    );

    button.disabled = false;
    button.textContent = "Log Out";

    return;

  }

  window.location.href = "auth.html";

}


/* ==============================
   START
============================== */

loadProfile();

</script>

</body>
</html>
